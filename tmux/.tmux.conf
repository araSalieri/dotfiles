# Tmux Plugin
set -g @plugin "tmux-plugins/tpm"
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "ofirgall/tmux-window-name"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-copycat'

set -g @continuum-restore 'on'

set -g extended-keys on
set -g extended-keys-format csi-u

# Pane
set -g pane-border-lines heavy
set -g pane-border-style fg=#3c3836,bg=default
set -g pane-active-border-style fg=#fe8019,bg=default
bind-key S select-layout main-horizontal \; select-layout -E
bind-key V select-layout main-vertical \; select-layout -E

# Status bar
set -g status on
set -g status-style "fg=#a9a9a9,bg=default"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#{?client_prefix,#[fg=#f9e2af,bold] · PREFIX,}"
set -g status-right "#[fg=#cba6f7,bold]#S #[fg=#a6e3a1,bold]#H #[fg=#89b4fa,bold]%H:%M"
setw -g window-status-format " #[fg=#585b70]#I:#[fg=#a9a9a9]#W "
setw -g window-status-current-format " #[fg=#89b4fa,bold]#I:#W "
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#f9e2af"
setw -g window-status-bell-style "fg=#f38ba8,bold"

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# PI Notif
set -g allow-passthrough on

# Vim Config
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Reload Keybind
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"
