# PI Keybind
set -g extended-keys on

# Use Vim shortcuts in copy mode
set-window-option -g mode-keys vi

# Mimic Vim visual selection and copying
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Moving between pane like Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Status bar (matches neovim lualine) ─────────────────────
set -g status on
set -g status-interval 1
set -g status-style "fg=#a9a9a9,bg=default"

set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[fg=#89b4fa]▊#{?client_prefix,#[fg=#f9e2af,bold] · PREFIX,}"

set -g status-right "#[fg=#cba6f7,bold]#S #[fg=#a6e3a1,bold]#H #[fg=#89b4fa,bold]%H:%M #[fg=#89b4fa]▊"

setw -g window-status-format " #[fg=#585b70]#I:#[fg=#a9a9a9]#W "
setw -g window-status-current-format " #[fg=#89b4fa,bold]#I:#W "
setw -g window-status-separator ""

setw -g window-status-activity-style "fg=#f9e2af"
setw -g window-status-bell-style "fg=#f38ba8,bold"
