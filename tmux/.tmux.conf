# Use Vim shortcuts in copy mode
set-window-option -g mode-keys vi

# Mimic Vim visual selection and copying
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Status bar ─────────────────────────────────────────────
set -g status on
set -g status-interval 1
set -g status-style "fg=#cdd6f4,bg=#11111b"

set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[bg=#cba6f7,fg=#11111b,bold] #S #[bg=default]#{?client_prefix,#[bg=#f9e2af,fg=#11111b,bold] PREFIX ,}"

set -g status-right "#[fg=#a6e3a1,bold]#H #[fg=#585b70]│ #[fg=#fab387]%a %d %b #[fg=#585b70]│ #[fg=#89b4fa,bold]%H:%M "

setw -g window-status-format " #[fg=#6c7086]#I #[fg=#a6adc8]#W "
setw -g window-status-current-format "#[bg=#89b4fa,fg=#11111b,bold] #I:#W "
setw -g window-status-separator ""

setw -g window-status-activity-style "fg=#f9e2af"
setw -g window-status-bell-style "fg=#f38ba8,bold"
