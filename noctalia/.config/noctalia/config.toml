[accessibility]
ui_scale = 1.0000000074505806

[bar.default]
auto_hide = true
background_opacity = 0.0
border = "surface_variant"
border_width = 20.0
capsule = true
capsule_padding = 15.0
capsule_thickness = 0.69999998807907104
center = [ "workspaces" ]
concave_edge_corners = false
end = [ "group:g1" ]
font_family = "JetBrainsMono Nerd Font Mono"
layer = "overlay"
margin_edge = 0
margin_ends = 1022
padding = 0
panel_overlap = 0
radius_bottom_left = 80
radius_bottom_right = 80
radius_top_left = 0
radius_top_right = 0
reserve_space = false
scale = 1.0000000074505806
shadow = false
smart_auto_hide = false
start = [ "group:g2" ]
thickness = 25

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "volume", "tray" ]
    opacity = 1.0
    padding = 15.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "clock", "notifications" ]
    opacity = 1.0
    padding = 15.0

[control_center]
width = 600

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
keyboard_layout = false

[plugins]
enabled = [ "jamesfeeder/special-workspaces" ]

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = false
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screenshot]
    copy_to_clipboard = true
    pipe_to_command = false
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Ayu"
custom_palette = "theme-oled"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "foot", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt" ]

[wallpaper]
fill_mode = "center"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ara/pictures/pure_black.jpg"

    [wallpaper.last]
    path = "/home/ara/pictures/pure_black.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/ara/pictures/pure_black.jpg"

[widget.audio_visualizer]
capsule = true
interactive = false
show_when_idle = true

[widget.cat]
cat_color = "primary"
cat_color_mode = "custom"
cat_size = 35
type = "dotnetrob/cat:cat"

[widget.clock]
capsule = true
color = "primary"
format = "{:%H:%M}"
interactive = false

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = false
interactive = false
max_length = 200
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "primary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.special-workspaces]
inactive_style = "ghost"
type = "jamesfeeder/special-workspaces:special-workspaces"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.temp]
show_value = false

[widget.tray]
capsule = false
capsule_fill = "on_secondary"
color = "primary"
detached_panel = true
drawer_columns = 4

[widget.volume]
color = "primary"
show_label = false

[widget.workspaces]
active_pill_size = 4.0
anchor = true
capsule = false
capsule_fill = "shadow"
hide_when_empty = false
inactive_pill_size = 1.0
labels_only_when_occupied = true
pill_scale = 0.80000000000000004
show_labels = false
