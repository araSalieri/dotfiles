shell=fish
title=foot
font=JetBrains Mono Nerd Font:size=10
letter-spacing=0
dpi-aware=no
pad=25x25
bold-text-in-bright=no
gamma-correct-blending=no

[scrollback]
lines=10000

[cursor]
style=block

[colors-dark]
alpha=1.0
background=000000

[key-bindings]
spawn-terminal=Mod4+Mod1+t
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
