promptToReturnFromSubprocess: false # skip "Press enter to return" after quitting nvim

gui:
  nerdFontsVersion: "3"
  showRandomTip: false
  shrinkSidePanelsToContent: true
  expandFocusedSidePanel: true
  showCommandLog: false
  # noctalia garnet, same as herdr: primary active border, dim inactive borders, #2a2424 selection
  theme:
    activeBorderColor:
      - "#990000"
      - bold
    inactiveBorderColor:
      - "#3a3a3a"
    searchingActiveBorderColor:
      - "#e6c14d"
    optionsTextColor:
      - "#990000"
    selectedLineBgColor:
      - "#2a2424"
    cherryPickedCommitBgColor:
      - "#3a3a3a"
    cherryPickedCommitFgColor:
      - "#990000"
    unstagedChangesColor:
      - "#d64545"
    defaultFgColor:
      - "#e8e0e0"
