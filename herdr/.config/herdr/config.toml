onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg = "reset"
# inactive tabs as plain text, no box
surface0 = "reset"
# noctalia garnet palette
accent = "#990000"
active_row_bg = "#2a2424"
selection_bg = "#2a2424"
surface1 = "#3a3a3a"
surface_dim = "#121212"
overlay0 = "#7a7070"
overlay1 = "#c4bcbc"
text = "#e8e0e0"
subtext0 = "#c4bcbc"
mauve = "#c97fa0"
green = "#7fc77f"
yellow = "#e6c14d"
red = "#d64545"
blue = "#6fa3d4"
teal = "#6fcaca"
peach = "#c8962a"

[keys]
prefix = "ctrl+a"
settings = "prefix+comma"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
detach = "prefix+d"
goto = "prefix+w"
switch_workspace = "prefix+shift+1..9"
next_workspace = "prefix+alt+n"
previous_workspace = "prefix+alt+p"
workspace_picker = "prefix+alt+w"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "~/.config/herdr/workspace-picker.sh"
width = "80%"
height = "70%"

# exec so the pane closes when lazygit quits
[[keys.command]]
key = "prefix+g"
type = "shell"
command = '''id=$(herdr pane split "$HERDR_ACTIVE_PANE_ID" --direction right --cwd "$HERDR_ACTIVE_PANE_CWD" --focus | jq -r .result.pane.pane_id) && herdr pane run "$id" "exec lazygit"'''
description = "lazygit in a split"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = '''id=$(herdr pane split "$HERDR_ACTIVE_PANE_ID" --direction right --cwd "$HERDR_ACTIVE_PANE_CWD" --focus | jq -r .result.pane.pane_id) && herdr pane run "$id" "exec yazi"'''
description = "yazi in a split"

# needs `herdr plugin install jeffarese/herdr-bar`
[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

# needs `herdr plugin install qu8n/herdr-automatic-rename`
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-automatic-rename.reset"
description = "hand this tab's name back to automatic naming"

# vim-tmux-navigator style: needs `herdr plugin install bojackduy/nvim-herdr-navigation/herdr-vim-navigator`
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"

[ui]
accent = "#990000"
tab_bar_position = "bottom"
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }, { type = "datetime", format = "%H:%M" }]
tab_bar_right_separator = " · "
sidebar_collapsed_mode = "hidden"  # default is "compact"
pane_outer_borders = false
pane_gaps = false
prompt_new_tab_name = false
pane_scrollbars = false

# default puts machine, workspace and tab on one line, which truncates
[ui.sidebar.agents]
rows = [["state_icon", "machine", "agent"], ["workspace"], ["tab"]]

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false
